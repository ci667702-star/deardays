<!doctype html>
<html lang="ko" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DearDays" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#008080" />
    <meta name="description" content="DearDays - 친구와 둘이서 쓰는 교환 일기" />
    <title>DearDays</title>
    <script>
      // 저장된 색 구성표를 화면을 그리기 전에 적용해 색이 깜빡이지 않게 한다.
      try {
        var t = localStorage.getItem('deardays:theme');
        if (t === 'classic' || t === 'plum') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'plum' ? '#7d3f73' : '#008080');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
