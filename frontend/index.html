<!doctype html>
<html lang="ko" data-theme="rose">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DearDays" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6cfda" />
    <meta name="description" content="DearDays - 친구와 함께 쓰는 교환 일기" />
    <title>DearDays</title>
    <script>
      // 저장된 색 구성표를 화면을 그리기 전에 적용해 색이 깜빡이지 않게 한다.
      try {
        // 테마 이름과 주소창 색 (src/utils/theme.js 의 THEMES 와 같아야 한다)
        var colors = { rose: '#ffeded', classic: '#008080', blue: '#A8D0EF', 'rose-sky': '#ffadc0', 'blue-sky': '#99c3e4' };
        var t = localStorage.getItem('deardays:theme-v2');
        if (colors[t]) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[t]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
