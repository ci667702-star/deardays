server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 일기 한 편에 사진 6장 × 5MB + 글. MAX_IMAGE_SIZE_MB 를 늘리면 이 값도 같이 늘린다.
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API 컨테이너 주소는 요청할 때마다 Docker DNS로 찾는다 (api 가 늦게 떠도 nginx 가 죽지 않게)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 나머지 경로는 React Router 가 처리 (새로 고침해도 404 가 나지 않게)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
